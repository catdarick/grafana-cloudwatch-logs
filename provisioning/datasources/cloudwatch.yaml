# Local development only. Credentials come from the Grafana container's environment,
# see docker-compose.yaml (~/.aws profile via AWS_PROFILE, or AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY).
apiVersion: 1

datasources:
  - name: CloudWatch
    type: cloudwatch
    uid: cloudwatch-dev
    jsonData:
      authType: default
      defaultRegion: ${AWS_REGION}
